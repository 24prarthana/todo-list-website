
<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(to right,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:400px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

.input-section{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:8px;
}

.addbtn{
    background:#667eea;
    color:white;
    border:none;
    padding:8px 12px;
}

ul{
    list-style:none;
    padding:0;
    margin-top:20px;
}

li{
    background:#f4f4f4;
    padding:10px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.completed{
    text-decoration:line-through;
    background:#d4edda;
}

.complete{
    background:green;
    color:white;
    border:none;
    padding:5px 8px;
    margin-right:5px;
}

.delete{
    background:red;
    color:white;
    border:none;
    padding:5px 8px;
}

</style>
</head>

<body>

<div class="container">

<h2>My To Do List</h2>

<div class="input-section">
<input type="text" id="taskInput" placeholder="Enter task">
<button class="addbtn" onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

</div>

<script>

function addTask(){

let input=document.getElementById("taskInput");
let task=input.value;

if(task===""){
alert("Enter a task");
return;
}

let li=document.createElement("li");

li.innerHTML = `
<span>${task}</span>
<div>
<button class="complete" onclick="completeTask(this)">Complete</button>
<button class="delete" onclick="deleteTask(this)">Delete</button>
</div>
`;

document.getElementById("taskList").appendChild(li);

input.value="";
}

function completeTask(button){
button.parentElement.parentElement.classList.toggle("completed");
}

function deleteTask(button){
button.parentElement.parentElement.remove();
}

</script>

</body>
</html>
