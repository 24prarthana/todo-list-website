
<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
width:350px;
padding:25px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
}

.input-section{
display:flex;
gap:10px;
}

input{
flex:1;
padding:8px;
}

button{
padding:8px 12px;
background:#667eea;
color:white;
border:none;
cursor:pointer;
}

ul{
list-style:none;
padding:0;
margin-top:20px;
}

li{
background:#f4f4f4;
padding:10px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.completed{
text-decoration:line-through;
background:#d4edda;
}

.complete{
background:green;
color:white;
border:none;
padding:4px 8px;
margin-right:5px;
}

.delete{
background:red;
color:white;
border:none;
padding:4px 8px;
}

</style>

</head>

<body>

<div class="container">

<h2>My To Do List</h2>

<div class="input-section">
<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || []

function displayTasks(){

let list = document.getElementById("taskList")
list.innerHTML = ""

tasks.forEach((task,index)=>{

let li = document.createElement("li")

if(task.completed){
li.classList.add("completed")
}

li.innerHTML = `
<span>${task.text}</span>
<div>
<button class="complete" onclick="completeTask(${index})">✓</button>
<button class="delete" onclick="deleteTask(${index})">X</button>
</div>
`

list.appendChild(li)

})

localStorage.setItem("tasks", JSON.stringify(tasks))

}

function addTask(){

let input = document.getElementById("taskInput")
let text = input.value

if(text === ""){
alert("Enter a task")
return
}

tasks.push({
text:text,
completed:false
})

input.value=""

displayTasks()

}

function completeTask(index){

tasks[index].completed = !tasks[index].completed

displayTasks()

}

function deleteTask(index){

tasks.splice(index,1)

displayTasks()

}

displayTasks()

</script>

</body>
</html>
